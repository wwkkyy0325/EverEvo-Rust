  <rect x="4" y="1" width="8" height="1" fill="#3CB371"/>
  <!-- Eyes -->
  <rect x="5" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="9" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="5" y="5" width="2" height="1" fill="#222"/>
  <rect x="9" y="5" width="2" height="1" fill="#222"/>
  <!-- Antenna -->
