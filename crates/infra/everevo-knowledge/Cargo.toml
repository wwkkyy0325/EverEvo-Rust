[package]
name = "everevo-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo knowledge layer — Oxigraph graph + multi-domain document ingestion & retrieval"

[dependencies]
everevo-core = { path = "../../kernel/everevo-core" }
everevo-vector = { path = "../everevo-vector" }

# Knowledge graph (Oxigraph SPARQL engine)
oxigraph = { version = "0.4", default-features = false }

# File watcher for domain document hot-reload
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["fs"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
async-trait.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
