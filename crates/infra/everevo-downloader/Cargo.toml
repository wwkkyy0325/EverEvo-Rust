[package]
name = "everevo-downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo download engine — multi-mirror, resumable, concurrent, observable"

[dependencies]
everevo-core = { path = "../../kernel/everevo-core" }
everevo-net = { path = "../everevo-net" }

tokio = { workspace = true, features = ["fs", "io-util", "sync", "time", "macros"] }
reqwest.workspace = true
ureq = { version = "3", features = ["gzip", "brotli", "native-tls"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
futures.workspace = true
tracing.workspace = true
tokio-util = { version = "0.7" }
async-trait = "0.1"

[lints]
workspace = true
