[package]
name = "everevo-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo sandbox — WSL→JobObjects→Filesystem layered process isolation"

[dependencies]
everevo-core = { path = "../../kernel/everevo-core" }

tokio = { workspace = true, features = ["process", "fs", "time"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait = "0.1"
which = "6"
regex-lite = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[lints]
workspace = true
