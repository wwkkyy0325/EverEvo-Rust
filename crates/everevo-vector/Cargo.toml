[package]
name = "everevo-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo vector store — embedding, chunking, and semantic search"

[dependencies]
everevo-core = { path = "../everevo-core" }

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tokio.workspace = true
thiserror.workspace = true
futures.workspace = true

# LanceDB — disk-backed ANN vector store. Compiled into binary.
lancedb = "0.31"

# Fastembed — local ONNX embedding (uses ort internally)
# Falls back to DummyEmbedder when feature is off or model missing
fastembed = { version = "5", optional = true }

# ort: fastembed sets default-features=false and omits `load-dynamic`, so we
# must enable it here. load-dynamic → ort-sys/disable-linking → no static
# link to onnxruntime.lib; the DLL is loaded at runtime via libloading.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }

[features]
default = ["lancedb", "onnx"]
lancedb = []
onnx = ["fastembed"]

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"
