[package]
name = "everevo-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo agent core — ReAct loop, tool registry, sandbox, knowledge layer"

[dependencies]
everevo-core = { path = "../../kernel/everevo-core" }
everevo-net = { path = "../../infra/everevo-net" }
everevo-db = { path = "../../infra/everevo-db" }
everevo-downloader = { path = "../../infra/everevo-downloader" }
everevo-bootstrap = { path = "../../infra/everevo-bootstrap" }
everevo-sandbox = { path = "../../infra/everevo-sandbox" }
# Telemetry now in everevo_core::telemetry
# Domain knowledge — now inline, was everevo-domain crate
sha2 = "0.10"

# Vector store (required — needs protoc for lancedb)
everevo-vector = { path = "../../infra/everevo-vector" }

# Workflow engine
everevo-workflow = { path = "../everevo-workflow" }

# Code search — inline (was everevo-code-search crate)
sqlx = { workspace = true, features = ["sqlite"] }
walkdir = "2"
regex = "1"

# Knowledge layer (extracted from inline — was everevo-kg + everevo-domain crates)
everevo-knowledge = { path = "../../infra/everevo-knowledge" }

tokio = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio-util.workspace = true
async-trait = "0.1"
base64 = "0.22"
tracing.workspace = true
reqwest.workspace = true
which = "6"
open = "5"
tokio-tungstenite = { version = "0.24", features = ["connect"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
