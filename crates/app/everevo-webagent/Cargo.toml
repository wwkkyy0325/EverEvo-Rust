[package]
name = "everevo-webagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo Web Agent — standalone MCP search service with stealth browser + CAPTCHA handling"

[[bin]]
name = "everevo-webagent"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "net"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest.workspace = true
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures = "0.3"
async-trait = "0.1"
which = "6"

[lints]
workspace = true
