[package]
name = "everevo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "EverEvo Axum server binary — assembles all crates and serves the API"

[[bin]]
name = "everevo-server"
path = "src/main.rs"

[dependencies]
everevo-core = { path = "../../kernel/everevo-core" }
everevo-agent = { path = "../everevo-agent" }
everevo-db = { path = "../../infra/everevo-db" }
everevo-bootstrap = { path = "../../infra/everevo-bootstrap" }
everevo-downloader = { path = "../../infra/everevo-downloader" }
everevo-sandbox = { path = "../../infra/everevo-sandbox" }
everevo-knowledge = { path = "../../infra/everevo-knowledge" }
everevo-vector = { path = "../../infra/everevo-vector" }
everevo-mcp = { path = "../../infra/everevo-mcp" }
everevo-workflow = { path = "../everevo-workflow" }
everevo-a2a = { path = "../everevo-a2a" }
everevo-kernel = { path = "../../kernel/everevo-kernel" }

axum.workspace = true
tower-http.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
tokio-util.workspace = true
clap.workspace = true
async-stream = "0.3"
toml = "0.8"
open = "5"
zip.workspace = true
reqwest.workspace = true
sqlx.workspace = true
rust-embed = "8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[lints]
workspace = true
