[workspace]
members = [
    "tools/web_search", "tools/memory", "tools/read_file", "tools/write_file",
    "tools/code_search", "tools/list_dir", "tools/web_fetch", "tools/download",
    "tools/verify", "tools/compact", "tools/todo_write", "tools/plan_mode", "tools/skill",
    "stages/best_practices", "stages/persona", "stages/skill_stage",
    "stages/memory_stage", "stages/domain",
    "hooks/audit", "hooks/review_gate", "hooks/reflect_gate",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
serde = "1"
serde_json = "1"
